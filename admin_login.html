<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | HMS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#e0f2fe,#f8fafc);
display:flex;
flex-direction:column;
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 6%;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:1.3rem;
font-weight:600;
color:#0b8fa1;
}

.logo img{width:42px;}

nav a{
text-decoration:none;
color:#334155;
font-weight:500;
}

/* LOGIN CARD */
.login-wrapper{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}

.login-box{
background:white;
width:360px;
padding:40px;
border-radius:18px;
box-shadow:0 20px 40px rgba(0,0,0,0.1);
text-align:center;
}

.login-box h2{
margin-bottom:8px;
color:#0b8fa1;
}

.login-box p{
color:#64748b;
font-size:0.9rem;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #cbd5e1;
font-size:0.95rem;
}

input:focus{
outline:none;
border-color:#0b8fa1;
}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#0b8fa1;
color:white;
font-size:1rem;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0369a1;
transform:translateY(-2px);
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
color:#64748b;
font-size:0.85rem;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<div class="logo">
<img src="v987-18a.png">
HMS Admin
</div>

<div>
<a href="index.html">Home</a>
&nbsp;&nbsp;
<a href="contact.html">Contact</a>
</div>
</nav>

<!-- LOGIN -->
<div class="login-wrapper">
<div class="login-box">
<h2>Admin Login</h2>
<p>Access hospital management dashboard</p>

<form action="admin.php" method="POST">
<input type="email" name="email" placeholder="Admin Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

</div>
</div>

<footer>
© 2026 Hospital Management System | Internal Use Only.
</footer>

</body>
</html>
